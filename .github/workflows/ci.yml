name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual trigger: allows running the identical checks from a fork when the
  # upstream repository's Actions are unavailable (e.g. the billing-locked
  # runner incident documented on PR #18).
  workflow_dispatch:

jobs:
  app:
    name: App and contracts (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Reads the pinned pnpm version from the root packageManager field.

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # The simulation core is dependency-free and not a pnpm workspace.
      # Run its own direct Node tests so an unrelated pnpm success cannot
      # masquerade as validation of robotic state, failure or replay logic.
      - name: Deterministic simulation kernel tests
        run: node --test services/simulation/core/*.test.mjs

      # Coordinate alignment must be tested against the actual world metadata.
      # This is a separate suite from the kernel unit tests and must run on
      # every PR before 3D users depend on world-frame pose correctness.
      - name: World-simulator ENU and altitude integration tests
        run: node --test services/simulation/integration/*.test.mjs

      # Independent Lane 2 asset pack: protect GLB integrity, origin/scale,
      # task-zone metadata and reproducible generation on the pinned runner.
      - name: Port-world asset validation and determinism
        run: node assets/port-world/tools/validate.mjs --selfcheck

      - name: Build
        run: pnpm build

  program:
    name: Anchor escrow program (Rust + LiteSVM)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: programs/vorqyn
    steps:
      - uses: actions/checkout@v4

      # The program targets the Anchor 1.2 MSRV (1.89.0), but the LiteSVM
      # dev-dependency graph (agave 4.4 crates) requires >= 1.98.1; the
      # crate's rust-toolchain.toml documents the same split.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      # cargo-build-sbf compiles the program to the BPF .so the LiteSVM
      # integration tests execute (programs/vorqyn/ACCOUNTS.md §6).
      - name: Install Agave CLI (cargo-build-sbf)
        run: |
          curl -LsSf https://release.anza.xyz/stable/install | sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: programs/vorqyn

      - name: Format check
        run: cargo fmt --check

      # build-sbf must precede clippy/test: the integration tests embed the
      # produced .so via include_bytes!.
      - name: Build SBF program
        run: cargo build-sbf

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check under Anchor MSRV (1.89.0)
        run: rustup toolchain install 1.89.0 --profile minimal && cargo +1.89.0 check

      - name: Tests (unit + LiteSVM integration)
        run: cargo test

      # NOTE: devnet deployment is intentionally NOT part of CI — no
      # keypair handling here. When VQ-06+ deploys, signatures are recorded
      # as PR evidence, never as CI output.
