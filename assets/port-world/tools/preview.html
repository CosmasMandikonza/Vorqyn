<!doctype html>
<!--
  VORQYN PORT-001 preview renderer (development tool — not shipped to the app).
  Renders models/port-world-high.glb with day lighting derived from world.json.

  Runtime dependency: three.js r180 (MIT) loaded from a PINNED jsdelivr URL at
  runtime for preview convenience only. It is NOT a dependency of the asset
  pack, the repository, or any build; committed GLBs contain no three.js code.
  If offline, previews can be regenerated by pointing the importmap at a local
  three install.

  Automation hooks (used by the browser to capture honest screenshots):
    window.__ready            -> true when world + world.json are loaded
    window.__setView(name)    -> moves camera; 'reset'|'air'|'land'|'underwater'|'inspect_crane'
    window.__view             -> current view name
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PORT-001 preview</title>
<meta name="viewport" content="width=1280" />
<style>
  html,body{margin:0;height:100%;background:#0d2226;}
  canvas{display:block;}
  #hud{position:fixed;left:10px;top:10px;color:#F2F0E8;font:12px monospace;
       background:rgba(16,38,42,.72);padding:6px 10px;border-radius:4px;}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hud">loading…</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const hud = document.getElementById("hud");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(1280, 720);
renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1280 / 720, 0.2, 2000);

let world;
try {
  world = await (await fetch("../world.json")).json();
} catch (e) {
  window.__error = "world.json fetch/parse failed: " + String((e && e.message) || e);
  hud.textContent = window.__error;
  throw e;
}

/* --- day lighting from world.json (ENU) -> glTF axes --- */
const az = world.environment.sun.azimuth_deg * Math.PI / 180;
const el = world.environment.sun.elevation_deg * Math.PI / 180;
// ENU sun direction unit vector: horizontal from azimuth (from N, clockwise),
// up component from elevation. Then convert ENU->glTF: (E,U,-N).
const dirENU = [Math.sin(az) * Math.cos(el), Math.cos(az) * Math.cos(el), Math.sin(el)];
const dirGLTF = new THREE.Vector3(dirENU[0], dirENU[2], -dirENU[1]).normalize();
const sun = new THREE.DirectionalLight(0xfff4e0, 2.6);
sun.position.copy(dirGLTF).multiplyScalar(300);
scene.add(sun);
const hemi = new THREE.HemisphereLight(0xe8e4d4, 0x16333a, 1.0);
scene.add(hemi);

const SKY = { color: 0xd7e2df, fog: new THREE.Fog(0xd7e2df, 500, 1100) };
const UNDERWATER = { color: 0x0b3237, fog: new THREE.Fog(0x0b3237, 4, 90) };
function applyEnv(kind) {
  if (kind === "underwater") {
    scene.background = new THREE.Color(UNDERWATER.color);
    scene.fog = UNDERWATER.fog;
  } else {
    scene.background = new THREE.Color(SKY.color);
    scene.fog = SKY.fog;
  }
}

/* --- load world --- */
const loader = new GLTFLoader();
let gltf;
try {
  gltf = await new Promise((ok, err) => loader.load("../models/port-world-high.glb", ok, undefined, (e) => err(new Error(e.message || "GLB load failed"))));
} catch (e) {
  window.__error = String((e && e.message) || e);
  hud.textContent = "GLB error: " + window.__error;
  throw e;
}
scene.add(gltf.scene);

/* waterline helper: subtle darker disc under water surface already in model;
   nothing extra needed. */

function targetOf(name) {
  const t = world.camera_targets;
  if (name === "reset") { const r = t.RESET; return { tgt: r.target_enu_m, dist: r.distance_m, az: r.azimuth_deg, el: r.elevation_deg }; }
  if (name === "air") { const a = t.AIR; return { tgt: a.target_enu_m, dist: (a.distance_range_m[0] + a.distance_range_m[1]) / 2, az: 215, el: 38 }; }
  if (name === "land") { const a = t.LAND; return { tgt: a.target_enu_m, dist: (a.distance_range_m[0] + a.distance_range_m[1]) / 2, az: 205, el: 25 }; }
  if (name === "underwater") {
    const u = t.UNDERWATER;
    return { tgt: u.target_enu_m, dist: 30, az: 340, el: 8, underwater: true };
  }
  if (name === "inspect_crane") {
    const anchor = world.anchors.find((x) => x.id === "crane_boom_tip");
    return { tgt: anchor.position_enu_m, dist: 26, az: 150, el: 18 };
  }
  return null;
}

/* ENU (x east, y north, z up) -> glTF (x east, z up, -y north) */
const toG = (p) => new THREE.Vector3(p[0], p[2], -p[1]);

let current = "none";
window.__view = current;
function setView(name) {
  const v = targetOf(name);
  if (!v) return false;
  applyEnv(v.underwater ? "underwater" : "day");
  const t = toG(v.tgt);
  const azr = v.az * Math.PI / 180, elr = v.el * Math.PI / 180;
  const off = new THREE.Vector3(
    Math.sin(azr) * Math.cos(elr), Math.sin(elr), -Math.cos(azr) * Math.cos(elr)
  ).multiplyScalar(v.dist);
  camera.position.copy(t).add(off);
  camera.lookAt(t);
  current = name;
  window.__view = name;
  hud.textContent = `PORT-001 · ${name} · cam ENU ${camera.position.x.toFixed(0)}, ${(-camera.position.z).toFixed(0)}, ${camera.position.y.toFixed(0)} m`;
  return true;
}
window.__setView = setView;

setView("reset");
let frames = 0;
(function loop() {
  renderer.render(scene, camera);
  frames++;
  if (frames === 3 && !window.__ready) window.__ready = true;
  requestAnimationFrame(loop);
})();
window.__ready = true;
</script>
</body>
</html>
