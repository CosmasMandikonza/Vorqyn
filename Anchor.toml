# Anchor workspace configuration - VQ-00 skeleton.
#
# Devnet program identity — keypair held by the Lane 1 deployer.
# The [programs.localnet] and [programs.devnet] entries share the same id
# because the local validator loads the same binary for E2E tests.
#
# The Anchor toolchain (avm/anchor + Solana CLI + local validator) is NOT
# installed by pnpm. `anchor build` / `anchor test` are manual steps;
# CI only runs cargo fmt/clippy/check on the program crate.

[features]
seeds = false
skip-lint = false

[programs.localnet]
vorqyn = "ChqJne5i8L5rZebCJrRde1wx76czKuSHpZJTKNkSNAGL"

[programs.devnet]
vorqyn = "ChqJne5i8L5rZebCJrRde1wx76czKuSHpZJTKNkSNAGL"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[test]
startup_wait = 5000
